      - "Dersin haritası: İstem → Bağlam → Harness → Döngü. Temel iyi istemdir ama tek başına yetmez."
    not: |
      [160] Üç maddeyi siz okumayın; öğrencilerden birine okutun.

  - id: cikis-karti
    tur: ifade
    etiket: "Çıkış kartı · 1 dakika"
    metin: "“İyi soru sormak yeter mi?” Tek cümleyle cevaplayın."
    alt: "Altına bugün aklınızı karıştıran tek bir şeyi yazın. Kâğıdı çıkarken bırakın."
    not: |
