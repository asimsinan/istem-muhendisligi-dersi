  # ───────────────────────── LAB (60 dk) ─────────────────────────

  - id: lab
    tur: lab
    bolum: "Lab"
    baslik: "Lab: İki araç, beş görev"
    hedef: "Aynı görevlerde iki sohbet aracının davranışını tahmin etmek, denemek ve karşılaştırmak."
    adimlar:
