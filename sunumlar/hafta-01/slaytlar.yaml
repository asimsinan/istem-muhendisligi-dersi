    metin: "İyi soru sormak yeter mi?"
    alt: "Aynı soru, farklı araç, farklı güvenilirlik. Fark çoğu zaman sorudan değil; bilgiden, araçlardan ve kontrolden geliyor."
    not: |
      [157] Dört katmana bağlayın: İstem aynıydı; fark bağlamda (kaynak), harness'ta (web araması) ve döngüde (kimse kontrol etmedi) ortaya çıktı.

