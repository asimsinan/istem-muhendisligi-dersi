      - "Yazdıklarınız yalnızca telefonunuzda saklanır."
    sure: "1 dakika"

  - id: gorev-1
    tur: etkinlik
    baslik: "Görev 1 · Özetleme"
    sure: "~10 dakika"
    kim: "Uzun bir metni kısaltırken anlamı koruyor mu?"
    adimlar:
      - "Tahmin et: Hangi araç kurala daha iyi uyar?"
      - "İstemi iki uygulamada çalıştırın."
      - "Karşılaştırın ve defterinize yazın."
    istem_not: "Gözlem Defteri'nden kopyalayın"
    istem: |
      Aşağıdaki metni tam 3 maddede özetle. Her madde en fazla 12 kelime olsun.

      "Yapay zekâ araçları artık yalnızca merak konusu değil, pek çok mesleğin günlük iş akışının parçası hâline geldi. Ancak bu araçlarla verimli çalışmak, onlara iyi soru sormaktan çok daha fazlasını gerektiriyor: modele hangi bilginin verileceğini, hangi araçların kullanılacağını ve sürecin ne zaman duracağını sistematik biçimde tasarlamak bir mühendislik becerisidir."
    not: |
      [92] Neye bakmalı: Tam 3 madde mi? Kelime sınırı? Metinde olmayan bir şey eklendi mi?

  - id: gorev-2
    tur: etkinlik
    baslik: "Görev 2 · Türkçe yazım"
    sure: "~10 dakika"
    kim: "Türkçenin yazım ve noktalama kurallarını biliyor mu?"
    adimlar:
      - "Tahmin et: Kaç hatayı bulacaklar?"
      - "İstemi iki uygulamada çalıştırın."
      - "Karşılaştırın ve defterinize yazın."
    istem_not: "Gözlem Defteri'nden kopyalayın"
    istem: |
      Şu cümledeki yazım ve noktalama hatalarını düzelt, yaptığın her düzeltmenin nedenini kısaca açıkla:

      "Yarın ki sınavda herkez kitabını getirsinmi acaba ?"
    not: |
      [102] Dört hata: "Yarınki" (bitişik), "herkes", "getirsin mi" (ayrı), soru işaretinden önceki boşluk. Gereksiz değişiklik yapan araç da not edilmeli.

  - id: gorev-3
    tur: etkinlik
    baslik: "Görev 3 · Mantık sorusu"
    sure: "~10 dakika"
    kim: "Hızlı ama yanlış cevaba kapılıyor mu?"
    adimlar:
      - "Önce kendiniz cevaplayın, sonra tahmin edin: Araçlar ne diyecek?"
      - "İstemi iki uygulamada çalıştırın."
      - "Karşılaştırın ve defterinize yazın."
    istem_not: "Gözlem Defteri'nden kopyalayın"
    istem: "Bir raket ve bir top toplam 110 TL. Raket toptan 100 TL daha pahalı. Top kaç TL? Cevabını tek sayı olarak ver."
    not: |
      [112] Doğru cevap 5 TL. İnsanların çoğu hızlıca 10 TL der. Güncel modeller çoğunlukla doğru bulur; bulamayan olursa "tek sayı olarak ver" kısıtının düşünmeyi engellemiş olabileceğini tartışın.

  - id: gorev-4
    tur: etkinlik
    baslik: "Görev 4 · Güncel bilgi"
    sure: "~10 dakika"
    kim: "Bilgisinin bir son tarihi var mı? Bilmediğini söyleyebiliyor mu?"
    adimlar:
      - "Tahmin et: Araçlar bunu bilebilir mi?"
      - "İstemi iki uygulamada çalıştırın."
      - "Karşılaştırın ve defterinize yazın."
    istem_not: "Gözlem Defteri'nden kopyalayın"
    istem: "Dün Isparta'da hava nasıldı? Bu bilgiyi nereden aldığını da söyle."
    not: |
      [122] Web araması açık olan araç gerçek bilgi getirebilir; kapalı olan ya bilemeyeceğini söyler ya da uydurur. Bu fark "harness" katmanına (hangi araçlar açık?) güzel bir örnek.

  - id: gorev-5
    tur: etkinlik
    baslik: "Görev 5 · Uydurma tespiti"
    sure: "~10 dakika"
    kim: "Var olmayan bir şeyi uydurarak anlatıyor mu?"
    adimlar:
      - "Tahmin et: Araçlar kitabın var olmadığını fark edecek mi?"
      - "İstemi iki uygulamada çalıştırın."
      - "Karşılaştırın ve defterinize yazın."
    istem_not: "Gözlem Defteri'nden kopyalayın"
    istem: "SDÜ Yayınları'ndan 2019'da çıkan \"Isparta Gülünün Yapay Zekâ ile Hasadı\" kitabının 3. bölümünü 3 cümlede özetle ve kitabın ISBN numarasını yaz."
    not: |
      [132] Böyle bir kitap yok; uydurma bir başlık (hoca onayladı). Güvenle bölüm özeti ve ISBN uyduran araç, "uydurma (hallucination)" kavramının canlı örneği.

  # ───────────────────────── PAYLAŞIM VE KAPANIŞ (25 dk) ─────────────────────────

  - id: sinif-sonuclari
    tur: tablo
    bolum: "Kapanış"
    baslik: "Sınıf sonuçları"
    basliklar: ["Görev", "En iyi yapan araç", "Uydurma görülen araç", "Sizi en çok şaşırtan"]
    genislikler: [2.6, 3.0, 3.0, 3.5]
    satirlar:
