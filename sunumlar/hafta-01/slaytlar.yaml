      - { ad: "Attention Is All You Need", url: "https://arxiv.org/abs/1706.03762", tur: "Vaswani vd. · makale", tarih: "2017 · yalnızca özet" }
      - { ad: "Effective context engineering for AI agents", url: "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents", tur: "Anthropic mühendislik blogu", tarih: "Eylül 2025 · ileri okuma" }
