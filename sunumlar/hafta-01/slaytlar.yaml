    sure: "Lab 50 dk + paylaşım 15 dk · teslim: gelecek ders"
    not: |
      [90] İkilileri aynı uygulamayı kullanmayacak şekilde eşleyin. Uygulaması olmayan için ChatGPT girişsiz çalışır.
      Her 10 dakikada bir sonraki görev slaytına geçin; tempo için iyi bir sinyal.

  - id: gozlem-defteri
    tur: interaktif
    baslik: "Gözlem Defteri'ni açın"
    url: "https://istem-muhendisligi-dersi.vercel.app/h01/gozlem"
    kisa_url: "istem-muhendisligi-dersi.vercel.app/h01/gozlem"
    adimlar:
