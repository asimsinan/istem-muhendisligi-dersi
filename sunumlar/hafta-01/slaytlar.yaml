# HAFTA 1 — Üretken yapay zekâya giriş
# Durum: ONAYLI v1 (05.10.2026). Metinler ve videolar (M1.1–M1.3) onaylandı; model tablosu dönem başında yeniden doğrulanacak.
# Kaynak: README.md v3.5 · YOL-HARITASI.md §5 (Hafta 1 kararları) · model bilgileri 05.10.2026 itibarıyla.
# Notlardaki [dk] işaretleri dersin başından itibaren yaklaşık zamanı gösterir.
# Lab görev metinleri interaktif/src/veri/h01-lab.ts ile AYNI olmalıdır.

deste:
  ad: hafta-01
  hafta: 1
  katman: 0
  baslik: "Hafta 1 · Üretken yapay zekâya giriş"
  yazar: "Asım Sinan Yüksel"

slaytlar:

  # ───────────────────────── AÇILIŞ (10 dk) ─────────────────────────

  - id: kapak
    tur: kapak
    bolum: Açılış
    ust: "Hafta 1"
    baslik: "Üretken yapay zekâya giriş"
    alt: "Bu araçlar nereden geliyor, bu ders onlarla ne yapmayı öğretecek?"
    yazar: "Asım Sinan Yüksel · Bahar 2027"
    not: |
      [0] Hoş geldiniz. Kendinizi kısaca tanıtın (1 dk). Öğrencilere bugün bilgisayar gerekmediğini, telefonlarının yeteceğini söyleyin.

  - id: bugunun-sorusu
    tur: ifade
    etiket: "Bugünün sorusu"
    metin: "ChatGPT'ye iyi soru sormak bir mühendislik becerisi olabilir mi?"
    alt: "Şimdi cevaplamayın. Dersin sonunda bu soruya tek cümleyle cevap yazacaksınız."
    not: |
      [1] Soruyu okuyun, 10 saniye sessiz bekleyin. Cevap almayın; merak oluşsun yeter.
      Dersin sonundaki çıkış kartında aynı soruya dönülecek.

  - id: mini-deney
    tur: etkinlik
    baslik: "Mini deney: aynı soru, iki araç"
    sure: "5 dakika"
    kim: "yanınızdakiyle ikili"
    adimlar:
      - "Biriniz bir sohbet uygulaması açsın, diğeriniz başka bir uygulama (ChatGPT, Gemini, Claude, Copilot…)."
      - "Sağdaki istemi ikiniz de kendi uygulamanıza yazın."
      - "Cevapları yan yana koyun: Aynı mı? Hangisine daha çok güveniyorsunuz?"
    istem: "Isparta'nın plaka kodu nedir ve şehrin en bilinen üç özelliği nelerdir? Bilgiyi hangi kaynaklardan aldığını da yaz."
    not: |
      [2] Uygulaması olmayan öğrenci eşininkine baksın. ChatGPT giriş yapmadan da çalışır; Gemini ve Claude hesap ister.
      Doğru plaka kodu 32. Asıl ilginç nokta "kaynak" kısmı: bazı araçlar gerçek bağlantı verir, bazıları uydurur ya da kaynak veremez.

  - id: ne-gordunuz
    tur: liste
    baslik: "Ne gördünüz?"
    maddeler:
      - "Cevaplar aynı mıydı? Hangi noktada ayrıştılar?"
      - "Kaynak gösterdi mi? Gösterdiği kaynak gerçekten var mı?"
      - "Hangi cevaba daha çok güvendiniz ve neden?"
    not: |
      [7] 2–3 ikiliden kısa paylaşım alın. Mesaj: Aynı soru, farklı araç → farklı cevap ve farklı güvenilirlik.
      "İyi soru sormak" tek başına güvenilir sonucu garanti etmiyor. Bu dersin konusu tam olarak bu boşluk.

  - id: hedefler
    tur: liste
    numarali: true
    baslik: "Bu hafta neler öğreneceğiz?"
    maddeler:
      - "Yapay zekâ, makine öğrenmesi, derin öğrenme ve üretken yapay zekâ arasındaki ilişkiyi açıklamak"
      - "Ayırt edici ve üretken modeli örnekle birbirinden ayırmak"
      - "Güncel model ailelerini tanımak ve onları nereden takip edeceğini bilmek"
      - "Dersin dört katmanlı haritasını kendi cümlelerinizle anlatmak"
    not: |
      [8] Hedefleri hızlıca okuyun. Dönem sonunda bunlara "evet" diyebilmeleri gerektiğini söyleyin.

  - id: bugunun-plani
    tur: tablo
    baslik: "Bugünün planı"
    basliklar: ["Bölüm", "Süre", "Ne yapacağız?"]
    genislikler: [3.6, 1.4, 7.1]
    satirlar:
      - ["1 · Yapay zekâ ailesi", "20 dk", "Kavramlar, iki kısa animasyon, hızlı oylama"]
      - ["2 · Model aileleri", "15 dk", "Kim, ne zaman, hangisi? Nereden takip edilir?"]
      - ["3 · Sıradaki kelime", "15 dk", "Telefonla kısa deneme; model neden uydurur?"]
      - ["4 · Dersin haritası", "20 dk", "Dört katman, dönem planı, kurallar"]
      - ["Mola + Lab", "65 dk", "Telefonla: iki araç, beş görev"]
      - ["Paylaşım ve kapanış", "25 dk", "Sınıf sonuçları, çıkış kartı"]
    not: |
      [9] Bilgisayar gerekmediğini, lab'ın telefonla yapılacağını tekrar vurgulayın.

  - id: neredeyiz
    tur: video
    baslik: "Neredeyiz?"
    dosya: ../../animasyonlar/render/h01-m1.3k-dort-katman-kisa.mp4
    kapak: ../../animasyonlar/render/h01-m1.3k-dort-katman-kisa-kapak.png
    ipucu: "Her dersin başında bu harita gelecek; o haftanın katmanı vurgulanacak."
    not: |
      [10] 7 saniyelik video. Ayrıntıya girmeyin; haritanın tamamı Bölüm 4'te açılacak.

  # ───────────────────────── BÖLÜM 1 · YAPAY ZEKÂ AİLESİ (20 dk) ─────────────────────────

  - id: bolum-1
    tur: bolum
    bolum: "1 · Yapay zekâ ailesi"
    no: "Bölüm 1"
    baslik: "Yapay zekâ ailesi"
    alt: "Sınıflandırmaktan üretmeye"

  - id: oylama-siniflandirici
    tur: kontrol
    soru: "ChatGPT bir sınıflandırıcı mıdır?"
    secenekler:
      - "Evet"
      - "Hayır"
      - "Kısmen"
      - "Emin değilim"
    not: |
      [11] Ön soru: Cevabı şimdi vermeyin. Öğrencilerin tahmin etmesi, sonraki anlatımı daha akılda kalıcı yapar.
      Sayıları kabaca not edin; Bölüm 1 sonunda geri döneceğiz. (Doğru cevap "Hayır": üretken bir modeldir; ama aynı model sınıflandırma işi de yapabilir, bu yüzden "Kısmen" diyenlerle tartışılabilir.)

  - id: video-ic-ice
    tur: video
    baslik: "İç içe dört halka"
    dosya: ../../animasyonlar/render/h01-m1.1-ic-ice-kumeler.mp4
    kapak: ../../animasyonlar/render/h01-m1.1-ic-ice-kumeler-kapak.png
    yer_tutucu: "M1.1 · YZ ⊃ makine öğrenmesi ⊃ derin öğrenme ⊃ üretken YZ; “metin” alanına yakınlaşma (30 sn)"
    ipucu: "Her halka bir öncekinin içinde; bu ders en içteki halkanın metin kısmıyla ilgileniyor."
    not: |
      [12] Videoyu oynatın, sonra bir sonraki slaytta tabloyla pekiştirin.

  - id: dort-halka
    tur: tablo
    baslik: "Dört halka, dört örnek"
    basliklar: ["Kavram", "Ne yapar?", "Örnek"]
    genislikler: [3.2, 5.0, 3.9]
    satirlar:
      - ["Yapay zekâ", "İnsan zekâsı gerektiren bir işi yapan sistem", "Satranç oynayan program"]
      - ["Makine öğrenmesi", "Kuralı elle yazmak yerine veriden öğrenir", "E-posta spam filtresi"]
      - ["Derin öğrenme", "Çok katmanlı yapay sinir ağlarıyla öğrenir", "Telefonda yüz tanıma"]
      - ["Üretken yapay zekâ", "Öğrendiği kalıplarla yeni içerik üretir", "ChatGPT, görsel üreticiler"]
    not: |
      [14] Her satır için öğrencilerden bir örnek daha isteyin (30 sn). Bu derste odağın metin üreten modeller olduğunu söyleyin; görüntü ve ses kapsam dışı.

  - id: video-ayirt-uretken
    tur: video
    baslik: "Etiket vermek ve üretmek"
    dosya: ../../animasyonlar/render/h01-m1.2-ayirt-uretken.mp4
    kapak: ../../animasyonlar/render/h01-m1.2-ayirt-uretken-kapak.png
    yer_tutucu: "M1.2 · Aynı e-posta: sınıflandırıcı “spam / değil” der, üretken model ona cevap yazar (30 sn)"
    ipucu: "Girdi aynı; değişen, modelin çıktısının türü."

  - id: ayirt-uretken
    tur: iki-kolon
    baslik: "Ayırt edici ve üretken model"
    sol:
      baslik: "Ayırt edici (discriminative)"
      maddeler:
        - "Girdiye bir etiket verir"
        - "Çıktı: sınıf veya sayı"
        - "Örnek: Bu e-posta spam mı?"
        - "Cevap kümesi önceden bellidir"
    sag:
      baslik: "Üretken (generative)"
      maddeler:
        - "Yeni içerik üretir"
        - "Çıktı: metin, görüntü, kod…"
        - "Örnek: Bu e-postaya cevap yaz."
        - "Cevap kümesi açıktır; aynı soruya farklı cevap gelebilir"
    not: |
      [17] Son madde mini deneyle bağlantılı: "Aynı soruya iki araç neden farklı cevap verdi?" Bunun bir nedeni de üretken modelin doğası. Ayrıntısı Hafta 2'de (sıcaklık).

  - id: llm-nedir
    tur: kavram
    baslik: "Büyük dil modeli (LLM)"
    tanim: "Çok büyük miktarda metinle eğitilmiş, bir metnin ardından gelecek parçayı tahmin ederek metin üreten üretken model."
    ornek: "ChatGPT, Gemini, Claude birer sohbet uygulamasıdır; arkalarında birer büyük dil modeli çalışır."
    benzetme: "Telefonunuzun klavyesindeki otomatik tamamlamayı düşünün; şimdi onun internetin büyük bölümünü okumuş ve bütün bir sohbeti sürdürebilen dev bir hâlini."
    not: |
      [18] Uygulama ile model ayrımına dikkat çekin: ChatGPT bir ürün, arkasındaki GPT bir model. Bu ayrım Hafta 3'te API ile model çağırırken önemli olacak.

  - id: kontrol-uretken
    tur: kontrol
    cevap_slayti: true
    soru: "Aşağıdakilerden hangisi üretken bir model görevidir?"
    secenekler:
      - "Bir e-postanın spam olup olmadığını belirlemek"
      - "Bir ürün yorumunu olumlu/olumsuz diye etiketlemek"
      - "Toplantı notlarından özet paragraf yazmak"
      - "Bir fotoğraftaki nesneyi sınıflandırmak"
    dogru: 2
    aciklama: "Özet yazmak yeni metin üretir; diğer üçü önceden belli etiketlerden birini seçer (ayırt edici)."
    not: |
      [19] Yanınızdakiyle 30 saniye tartışın, sonra el kaldırarak cevap alın. Ardından ön soruya dönün: "ChatGPT bir sınıflandırıcı mı?" Şimdi ne düşünüyorlar?

  # ───────────────────────── BÖLÜM 2 · MODEL AİLELERİ (15 dk) ─────────────────────────

  - id: bolum-2
    tur: bolum
    bolum: "2 · Model aileleri"
    no: "Bölüm 2"
    baslik: "Model aileleri"
    alt: "Kim, ne zaman, hangisi?"

  - id: oylama-arac
    tur: kontrol
    baslik: "Hızlı oylama"
    soru: "En çok hangi aracı kullanıyorsunuz?"
    secenekler:
      - "ChatGPT"
      - "Gemini"
      - "Claude"
      - "Diğer (Copilot, DeepSeek…)"
    yonerge: "El kaldırarak oylayın. Hangi aracın arkasında hangi model ailesi var, birazdan göreceğiz."
    not: |
      [31] Sonuçları kabaca söyleyin. Sonraki iki slaytta bu araçların arkasındaki aileleri göstereceğiz.

  - id: zaman-cizelgesi
    tur: zaman_cizelgesi
    baslik: "2017'den bugüne"
    olaylar:
      - { yil: 2017, ad: "Transformer", not: "“Attention Is All You Need” makalesi", vurgu: true }
      - { yil: 2018, ad: "GPT-1, BERT", not: "Önce genel metinle eğit, sonra göreve uyarla" }
      - { yil: 2020, ad: "GPT-3", not: "175 milyar parametre; birkaç örnekle yeni görev" }
      - { yil: 2022, ad: "ChatGPT", not: "Sohbet arayüzü; kitlesel kullanım başladı", vurgu: true }
      - { yil: 2023, ad: "GPT-4, Claude, Llama", not: "Güçlü kapalı modeller ve açık ağırlıklı modeller" }
      - { yil: 2024, ad: "Çok modlu, uzun bağlam", not: "Görüntü, ses; çok uzun belgeler" }
      - { yil: 2025, ad: "Akıl yürütme ve ajanlar", not: "Adım adım düşünen modeller, araç kullanan sistemler" }
      - { yil: 2026, ad: "Bugün", not: "Odak modelden sisteme: bağlam, harness, döngü", vurgu: true }
    alt: "Sekiz yılda “metin tamamlayan model”den “araç kullanan sisteme”."
    kaynak: "Vaswani vd. (2017); Radford vd. (2018); Brown vd. (2020); OpenAI (2022)"
    not: |
      [32] Üç vurgulu yıla odaklanın: 2017 mimari, 2022 kitlesel kullanım, 2026 sistem mühendisliği. Bu dersin neden şimdi açıldığını bağlayın.

  - id: model-aileleri
    tur: tablo
    baslik: "Güncel model aileleri (Ekim 2026)"
    basliklar: ["Aile", "Geliştirici", "Erişim", "Güncel örnek"]
    genislikler: [2.35, 1.6, 2.55, 5.45]
    satirlar:
      - ["GPT", "OpenAI", "Kapalı + açık ağırlıklı", "GPT-6 ailesi (Astra, Sol) · açık: gpt-oss"]
      - ["Claude", "Anthropic", "Kapalı", "Claude Fable 5 · Claude Opus / Sonnet 5.5"]
      - ["Gemini · Gemma", "Google", "Kapalı + açık ağırlıklı", "Gemini 4 Argon · Gemini 3.x · açık: Gemma 4"]
      - ["Qwen", "Alibaba", "Açık ağırlıklı + kapalı", "Qwen 3.8"]
      - ["DeepSeek", "DeepSeek", "Açık ağırlıklı (MIT)", "DeepSeek V4 · V4.1"]
      - ["Llama", "Meta", "Açık ağırlıklı", "Llama 4"]
    kaynak: "Üreticilerin duyuruları ve openrouter.ai/models · erişim 05.10.2026 (dönem başında güncellenecek)"
    not: |
      [36] ÖNEMLİ: Bu tablo dönem başından hemen önce yeniden doğrulanacak; model adları birkaç ayda bir değişiyor.
      Güncel durum (05.10.2026): OpenAI GPT-6 Astra'yı Eylül 2026'da çıkardı (ardından Sol/Luna ve 6.1 Sol). Anthropic'in en üst modeli Claude Fable 5 (Haziran 2026); Opus ve Sonnet 5.5 Eylül sonunda geldi. Google Gemini 4 Argon'u 30 Eylül'de duyurdu; şimdilik seçili iş ortaklarına açık, uygulamalarda genelde Gemini 3.x var. Qwen 3.8'in büyük modeli de 27B sürümü de açık ağırlıklı. DeepSeek V4 MIT lisanslı. Meta, kendi sohbet uygulamalarında Llama yerine Muse Spark kullanmaya başladı; indirilebilir son Meta modeli Llama 4.
      Oylamaya bağlayın: "ChatGPT'nin arkasında GPT ailesi, Gemini uygulamasının arkasında Gemini ailesi var."

  - id: uygulama-model
    tur: tablo
    baslik: "Kullandığınız uygulama, arkasındaki model"
    basliklar: ["Uygulama", "Şirket", "Arkasındaki model ailesi"]
    genislikler: [3.4, 3.0, 5.6]
    satirlar:
      - ["ChatGPT", "OpenAI", "GPT"]
      - ["Gemini", "Google", "Gemini"]
      - ["Claude", "Anthropic", "Claude"]
      - ["DeepSeek", "DeepSeek", "DeepSeek"]
      - ["Copilot", "Microsoft", "Birden çok model (ör. GPT, Claude)"]
      - ["Meta AI", "Meta", "Muse Spark"]
    alt: "Uygulama bir ürün; model onun içindeki motor."
    not: |
      [38] Oylamaya dönün: "En çok ChatGPT diyenler aslında GPT ailesinden bir model kullanıyor." Hafta 3'te uygulama olmadan, doğrudan modele API ile bağlanacağız.

  - id: kapali-acik
    tur: iki-kolon
    baslik: "Kapalı ve açık ağırlıklı modeller"
    sol:
      baslik: "Kapalı"
      maddeler:
        - "Yalnızca uygulama veya API ile kullanılır"
        - "Modelin ağırlıkları paylaşılmaz"
        - "Genelde en güçlü modeller"
        - "Örnek: GPT-6, Claude, Gemini"
    sag:
      baslik: "Açık ağırlıklı (open-weight)"
      maddeler:
        - "Ağırlıklar indirilebilir"
        - "Kendi bilgisayarınızda çalışır (Hafta 5)"
        - "Veri dışarı çıkmaz, kullanım ücretsiz"
        - "Örnek: Qwen, DeepSeek, Gemma, Llama"
    not: |
      [41] "Açık ağırlıklı" ile "açık kaynak" aynı şey değil: ağırlıklar açık olabilir ama eğitim verisi ve kodu paylaşılmamış olabilir. Hafta 5'te Ollama ile bir açık ağırlıklı modeli kendi bilgisayarımızda çalıştıracağız.

  - id: ezberleme
    tur: ifade
    etiket: "Aklınızda kalsın"
    metin: "Model adlarını ezberlemeyin. Nereden takip edeceğinizi bilin."
    alt: "Güncel liste: openrouter.ai/models · Üreticilerin kendi model sayfaları"
    not: |
      [44] Bu dersteki teknikler model değişse de geçerli kalacak. Hafta 3'te OpenRouter'da aynı kodla farklı modelleri deneyeceğiz.

  # ───────────────────────── BÖLÜM 3 · SIRADAKİ KELİME (10 dk) ─────────────────────────

  - id: bolum-3
    tur: bolum
    bolum: "3 · Sıradaki kelime"
    no: "Bölüm 3"
    baslik: "Sıradaki kelime"
    alt: "Bir dil modeli aslında ne yapıyor?"

  - id: siradaki-kelime
    tur: kavram
    baslik: "Sıradaki kelimeyi tahmin etmek"
    tanim: "Model, o ana kadarki metne bakıp sıradaki parçanın olasılıklarını hesaplar, birini seçer, metne ekler ve bunu tekrar eder."
    ornek: "“Isparta'nın en meşhur ürünü ___” → gül %53 · elma %25 · halı %10 · …"
    benzetme: "Bir cümleyi kelime kelime kuran ve her adımda “buraya en çok ne yakışır?” diye soran biri. Hep en olası kelimeyi seçmek zorunda değil; arada ikinci veya üçüncüyü de seçebilir."
    not: |
      [47] Mini deneydeki "farklı cevap" burada açıklanıyor: Model her adımda bir seçim yapıyor ve bu seçim her seferinde aynı olmayabilir.

  - id: dene-sicaklik
    tur: interaktif
    baslik: "Dene: Sıradaki kelimeyi model nasıl seçiyor?"
    url: "https://istem-muhendisligi-dersi.vercel.app/h02/sicaklik"
    kisa_url: "istem-muhendisligi-dersi.vercel.app/h02/sicaklik"
    adimlar:
      - "QR kodu okutun; sayfada “Bir kelime üret”e birkaç kez basın."
      - "Sıcaklığı en sola, sonra en sağa çekin. Ne değişti?"
      - "“10 kez üret” ile sonuçların dağılımına bakın."
    sure: "4 dakika"
    not: |
      [49] Bu sayfa Hafta 2'nin konusu; burada yalnızca sezgi kazanmaları yeterli. "Sıcaklık" ve "top-p" kavramlarını açıklamayın, sadece gözlemlerini sorun.

  - id: neden-uydurur
    tur: kavram
    baslik: "Model neden uydurur?"
    tanim: "Dil modeli bilgiyi bir veritabanından okumaz; metnin en olası devamını üretir. Bu yüzden kulağa doğru gelen ama gerçek olmayan bir cümle de üretebilir."
    ornek: "“Kitabın ISBN numarası 978-605-…” Biçim kusursuz, sayı uydurma. Kaynak listesinde var olmayan makaleler de aynı nedenle çıkar."
    benzetme: "Konuyu bilmeyen ama cevabı kendinden emin bir dille yazan öğrenci. Yazı akıcıdır; doğru olup olmadığını ancak kontrol ederek anlarsınız."
    not: |
      [53] Mini deneydeki "kaynak" sorusuna bağlayın. Lab'da Görev 4 ve 5 tam olarak bunu yokluyor. Uydurmayı azaltan şeyler (doğru bağlam, araç, kontrol) dersin sonraki katmanları.

  - id: transformer
    tur: kavram
    baslik: "Transformer, tek cümlede"
    tanim: "2017'de tanıtılan mimari: her kelime, cümledeki diğer kelimelere “bakarak” kendi anlamını bağlama göre belirler. Bu bakmaya dikkat (attention) denir."
    ornek: "Ayrıntısı ve animasyonu Hafta 2'de: token, gömme, dikkat, sıcaklık."
    benzetme: "“Ali kitabı Ayşe'ye verdi çünkü o…” cümlesinde “o”nun kim olduğunu anlamak için geriye bakarsınız. Model de her kelime için aynısını yapar."
    kaynak: "Vaswani vd., “Attention Is All You Need” (2017)"
    not: |
      [56] En fazla 2 dakika. Matematik yok. Hafta 2'ye merak bırakın.

  # ───────────────────────── BÖLÜM 4 · DERSİN HARİTASI (20 dk) ─────────────────────────

  - id: bolum-4
    tur: bolum
    bolum: "4 · Dersin haritası"
    no: "Bölüm 4"
    baslik: "Dersin haritası"
    alt: "İstemden döngüye dört katman ve bu dönem nasıl ilerleyeceğiz"

