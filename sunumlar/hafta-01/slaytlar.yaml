      - { tr: "Ayırt edici model", en: "discriminative model", tanim: "Girdiye önceden belli etiketlerden birini veren model." }
      - { tr: "İstem", en: "prompt", tanim: "Modele yazdığınız soru veya talimat." }
      - { tr: "Açık ağırlıklı model", en: "open-weight model", tanim: "Ağırlıkları indirilebilen, kendi bilgisayarınızda çalışabilen model." }
      - { tr: "Uydurma", en: "hallucination", tanim: "Modelin gerçek olmayan bilgiyi güvenle doğruymuş gibi sunması." }
    not: |
