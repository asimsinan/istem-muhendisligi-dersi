# HAFTA 2 — Model kabaca nasıl çalışır?
# Durum: metinler onaylı (06.10.2026); 09.10.2026 sitedeki model seçiciye göre güncellendi. Akış: YOL-HARITASI.md §5 "Hafta 2 kararları".
# Kaynak: README.md v3.6 · token ölçümleri tiktoken (o200k_base, cl100k_base) ile 06.10.2026'da yapıldı.
# Notlardaki [dk] işaretleri dersin başından itibaren yaklaşık zamanı gösterir.
# Lab görev metinleri interaktif Lab Defteri (/h02/lab) ile AYNI olmalıdır.

deste:
  ad: hafta-02
  hafta: 2
  katman: 0
  baslik: "Hafta 2 · Model kabaca nasıl çalışır?"
  yazar: "Asım Sinan Yüksel"

slaytlar:

  # ───────────────────────── AÇILIŞ (10 dk) ─────────────────────────

  - id: kapak
    tur: kapak
    bolum: Açılış
    ust: "Hafta 2"
    baslik: "Model kabaca nasıl çalışır?"
    alt: "Metin modele nasıl girer, cevap nasıl çıkar?"
    yazar: "Asım Sinan Yüksel · Bahar 2027"
    not: |
      [0] Bilgisayarların açık ve şarjda olduğunu kontrol edin. Bugün lab bilgisayarla.

  - id: gecen-hafta
    tur: ifade
    etiket: "Geçen haftadan"
    metin: "Çıkış kartlarınızda en çok karışan konu"
    alt: "İki dakikada birlikte netleştirelim."
    not: |
      [1] Kartları ders öncesi okuyun; en sık geçen karışıklığı seçin. Genellikle "uygulama ile model farkı" ya da "neden farklı cevap veriyor" çıkar; ikincisi bugünün konusu.

  - id: bugunun-sorusu
    tur: ifade
    etiket: "Bugünün sorusu"
    metin: "Aynı anlamdaki bir Türkçe cümle, İngilizcesinden kaç kat token tutar?"
    alt: "“Öğrencilerimizden gelen soruları cevaplayabilecek bir yapay zekâ asistanı geliştirmek istiyoruz.” · “We want to build an AI assistant that can answer the questions coming from our students.”"
    not: |
      [3] "Token" kelimesini henüz tanımlamayın; "modelin okuduğu parça" demeniz yeterli. Cevabı canlı saymak için: hafta-02/demo.ipynb, H2·3 hücresi (anahtar gerekmez).

  - id: oylama-kac-kat
    tur: kontrol
    baslik: "Tahmin edin"
    soru: "Türkçe cümle, İngilizcesine göre kaç kat token tutar?"
    secenekler:
      - "Aynı (1 kat)"
      - "Yaklaşık 1,5 kat"
      - "Yaklaşık 2 kat"
      - "3 kat veya daha fazla"
    yonerge: "El kaldırarak oylayın. Cevap birinci bölümde."
    not: |
      [4] Sayıları kabaca not edin. Cevap: GPT'nin güncel tokenizer'ında 1,5 kat, eski tokenizer'ında 2,1 kat (slayt "Türkçe vergisi").

  - id: neredeyiz
    tur: video
    baslik: "Neredeyiz?"
    dosya: ../../animasyonlar/render/h01-m1.3k-dort-katman-kisa.mp4
    kapak: ../../animasyonlar/render/h01-m1.3k-dort-katman-kisa-kapak.png
    ipucu: "Hâlâ en içteki katmandayız: İstem. Bugün istemin modelin içinde neye dönüştüğüne bakıyoruz."
    not: |
      [5] Kısa geçin.

  - id: hedefler
    tur: liste
    numarali: true
    baslik: "Bu hafta neler öğreneceğiz?"
    maddeler:
      - "Bir metnin token'lara nasıl bölündüğünü göstermek ve token sayısının neden önemli olduğunu açıklamak"
      - "Token'ın vektöre dönüşmesini ve sıra bilgisinin rolünü anlatmak"
      - "Dikkat mekanizmasını bir örnek cümle üzerinden açıklamak"
      - "Sıcaklık ve top-p'nin çıktıyı nasıl değiştirdiğini deneyerek göstermek"
    not: |
      [6] Dört hedef, dört bölüm.

  - id: bugunun-plani
    tur: tablo
    baslik: "Bugünün planı"
    basliklar: ["Bölüm", "Süre", "Ne yapacağız?"]
    genislikler: [3.4, 1.4, 7.3]
    satirlar:
      - ["1 · Token", "25 dk", "Metin parçalara nasıl bölünür? Türkçe neden pahalı?"]
      - ["2 · Vektör", "15 dk", "Parçalar sayılara nasıl dönüşür? Model boyutu"]
      - ["3 · Dikkat", "20 dk", "Kelimeler birbirine nasıl bakar? Canlı gösterim"]
      - ["4 · Seçim", "15 dk", "Sıcaklık ve top-p"]
      - ["Mola + Lab", "65 dk", "Bilgisayarla: token ölçümü ve sıcaklık deneyi"]
      - ["Kapanış", "15 dk", "Sonuçlar, çıkış kartı, Hafta 3 hazırlığı"]
    not: |
      [7] Hafta 3 için OpenRouter hesabı açılacağını şimdiden söyleyin.

  - id: serit
    tur: akis
    baslik: "Bugünün şeridi: metinden cevaba"
    adimlar:
      - { ad: "Metin", aciklama: "Sizin yazdığınız istem" }
      - { ad: "Token", aciklama: "Metin parçalara bölünür" }
      - { ad: "Vektör", aciklama: "Her parça bir sayı listesine dönüşür" }
      - { ad: "Dikkat", aciklama: "Parçalar birbirine bakar" }
      - { ad: "Seçim", aciklama: "Sıradaki parça seçilir" }
    alt: "Model bu şeridi her yeni token için baştan sona tekrar eder."
    not: |
      [8] Kademeli slayt: her tıklamada bir kutu gelir. Her bölümün başında bu şeridin bir kutusu yanacak.

  # ───────────────────────── BÖLÜM 1 · TOKEN (25 dk) ─────────────────────────

  - id: bolum-1
    tur: bolum
    bolum: "1 · Token"
    no: "Bölüm 1"
    baslik: "Token"
    alt: "Model metni nasıl parçalara böler?"

  - id: serit-token
    tur: akis
    kademeli: false
    etkin: 1
    baslik: "Şeritte neredeyiz?"
    adimlar:
      - { ad: "Metin" }
      - { ad: "Token" }
      - { ad: "Vektör" }
      - { ad: "Dikkat" }
      - { ad: "Seçim" }
    not: |
      [11] Tek cümle: "Model metni harf harf ya da kelime kelime değil, parça parça okur."

  - id: kelime-tahmin
    tur: kontrol
    cevap_slayti: true
    baslik: "Tahmin edin"
    soru: "GPT'nin tokenizer'ı “öğrencilerimizden” kelimesini kaç parçaya böler?"
    secenekler:
      - "1 (tek kelime)"
      - "3 (öğrenci · ler · imizden)"
      - "5 (her ek ayrı)"
      - "7"
    dogru: 3
    aciklama: "7 parça: ö · ğ · r · enc · iler · imiz · den. Bölünme eklere göre değil, sıklığa göre yapılır."
    not: |
      [12] Önce el kaldırma, sonra cevap slaytı. Çoğu öğrenci 3 ya da 5 der; eklere göre bölündüğünü düşünür. İlginç olan "ö", "ğ", "r" gibi tek harflik parçalar.

  - id: token-nedir
    tur: kavram
    baslik: "Token nedir?"
    tanim: "Modelin işlediği en küçük metin parçası. Bir kelime, kelimenin bir parçası, bir noktalama işareti ya da bir emoji olabilir."
    ornek: "“from our students” → from · our · students (3 token) · “öğrencilerimizden” → 7 token"
    benzetme: "Lego parçaları: Model metni hazır parçalardan kurar. Sık kullanılan kelimeler tek parça; nadir kelimeler küçük parçaların birleşimi."
    not: |
      [14] Modelin bir "sözlüğü" (vocabulary) olduğunu söyleyin: GPT'nin güncel tokenizer'ında yaklaşık 200 bin parça var (o200k adı buradan).

  - id: video-bpe
    tur: video
    baslik: "Parçalar nasıl belirlenir? BPE"
    dosya: ../../animasyonlar/render/h02-m2.1-bpe.mp4
    kapak: ../../animasyonlar/render/h02-m2.1-bpe-kapak.png
    yer_tutucu: "M2.1 · BPE adım adım, bir paragrafta: yan yana ikililer sayılır, en sık olan her yerde birleşir; 18 adımda 192 parça → 101 (77 sn)"
    ipucu: "En sık yan yana gelen iki parça birleşir; bu, sözlük dolana kadar tekrar eder."
    not: |
      [16] BPE: Byte Pair Encoding (Sennrich vd., 2016). Videoda dört cümlelik bir paragraf harflere bölünür; ilk adımda “l + a” ikilisinin metinde 12 kez yan yana geçtiği tek tek sayılır. En sık ikili her yerde birleşir: la → lar (çoğul eki) → en, er, ler … 18 adımda “öğrenciler” ve “kitap” tek parça olur. İngilizce metin çok olduğu için gerçek sözlükte İngilizce kelimeler tek parçaya kadar birleşmiş; Türkçe kelimeler yarı yolda kalmış.

  - id: bpe-canli
    tur: interaktif
    baslik: "Canlı: BPE adım adım"
    url: "https://istem-muhendisligi-dersi.vercel.app/h02/bpe"
    kisa_url: "istem-muhendisligi-dersi.vercel.app/h02/bpe"
    adimlar:
      - "Videodaki paragraf: “Sonraki birleştirme”ye basın."
      - "Basmadan önce tahmin edin: hangi ikili birleşecek?"
      - "Sağdaki tablo: ikililer kaçar kez geçiyor?"
    sure: "2 dakika · projeksiyonda; evde kendi paragrafınızla"
    kaynak: "Ders sitesi · videodaki paragraf ve aynı kurallar"
    not: |
      [17] Siz ilerletin. 3. adımdan sonra durup sorun: “Sıradaki ne olur?” Tablonun ilk satırını gösterin, sonra basın. “Sona kadar” ile 18 adımı bitirin ve “öğrenciler”, “kitap”, “lar” parçalarını gösterin. Öğrencilere evde kendi paragraflarını yapıştırıp denemelerini söyleyin.

  - id: tokenler
    tur: tokenler
    baslik: "Aynı anlam, farklı sayıda parça"
    satirlar:
      - { etiket: "İngilizce", parcalar: ["from", " our", " students"] }
      - { etiket: "Türkçe", parcalar: ["ö", "ğ", "r", "enc", "iler", "imiz", "den"] }
      - { etiket: "İngilizce", parcalar: ["Many", " drops", " make", " a", " lake", "."] }
      - { etiket: "Türkçe", parcalar: ["D", "aml", "aya", " dam", "l", "aya", " gö", "l", " olur", "."] }
    alt: "␣ işareti kelimenin önündeki boşluktur; boşluk da token'ın parçası."
    kaynak: "GPT o200k_base tokenizer, tiktoken ile ölçüldü (06.10.2026)"
    not: |
      [19] "aya" iki kez çıkıyor ama "damla" hiç tek parça değil. Model Türkçe kelimelerin eklerini bilmiyor; yalnızca hangi harf dizilerinin sık geçtiğini biliyor.

  - id: turkce-vergisi
    tur: sayilar
    baslik: "Türkçe vergisi: aynı anlam, daha çok token"
    ogeler:
      - { sayi: "17", ad: "İngilizce cümle", aciklama: "Her iki tokenizer'da da 17 token." }
      - { sayi: "26", ad: "Türkçe · güncel", aciklama: "GPT'nin güncel tokenizer'ı (o200k): 1,5 kat." }
      - { sayi: "36", ad: "Türkçe · eski", aciklama: "GPT-4'ün tokenizer'ı (cl100k): 2,1 kat." }
    alt: "Aynı iş için Türkçe daha çok token harcar: daha yüksek ücret, bağlam penceresine daha az metin."
    kaynak: "Bugünün sorusundaki cümle çifti · tiktoken, 06.10.2026 · ayrıca Petrov vd. (2023), Bayram vd. (2025)"
    not: |
      [21] Bugünün sorusunun cevabı. Oylama sonucuna dönün. Yeni tokenizer'ın Türkçeyi daha iyi bölmesi, çok dilli veriye daha çok yer verildiğini gösteriyor. Türkçe için özel tokenizer çalışmaları var (Bayram vd. 2025, TR-MMLU).

  - id: neden-onemli
    tur: liste
    baslik: "Token sayısı neden önemli?"
    maddeler:
      - "Maliyet: API'ler token başına ücret alır; hem gönderdiğiniz hem aldığınız token sayılır."
      - "Bağlam penceresi: Modelin bir seferde görebileceği metin token ile ölçülür."
      - "Hız: Model cevabı token token üretir; daha çok token, daha uzun bekleme."
      - "Garip hatalar: Harf saymak, kelimeyi ters yazmak zor; çünkü model harfleri değil parçaları görür."
    not: |
      [22] Son madde ilginç bir sınıf sorusu: "çilek kelimesinde kaç e var?" gibi sorularda modellerin zorlanmasının bir nedeni tokenizasyon.

  - id: dene-token
    tur: interaktif
    baslik: "Dene: Türkçe Token Laboratuvarı"
    url: "https://istem-muhendisligi-dersi.vercel.app/h02/token"
    kisa_url: "istem-muhendisligi-dersi.vercel.app/h02/token"
    adimlar:
      - "Adınızı ve soyadınızı yazın: kaç token?"
      - "Bir atasözü yazın, sonra İngilizcesini: hangisi daha uzun?"
      - "Bir emoji, bir tarih ve bir kod satırı deneyin."
    sure: "7 dakika"
    not: |
      [23] Bilgisayarlardan açtırın. Sayfa birkaç tokenizer'ı yan yana gösterir. 7 dakika sonra 2–3 ilginç sonucu sesli alın.

  - id: kontrol-token
    tur: kontrol
    cevap_slayti: true
    soru: "Aşağıdakilerden hangisi doğrudur?"
    secenekler:
      - "Bir token her zaman bir kelimedir"
      - "Tokenizer Türkçe kelimeleri eklerine göre böler"
      - "Aynı metin farklı modellerde farklı sayıda token tutabilir"
      - "Token sayısı maliyeti etkilemez"
    dogru: 2
    aciklama: "Her model ailesinin kendi tokenizer'ı ve sözlüğü var. Token kelimeden küçük de olabilir; bölünme ek değil sıklık esaslıdır; ücret token başına ödenir."
    not: |
      [31] 30 saniye, el kaldırma.

  # ───────────────────────── BÖLÜM 2 · VEKTÖR (15 dk) ─────────────────────────

  - id: bolum-2
    tur: bolum
    bolum: "2 · Vektör"
    no: "Bölüm 2"
    baslik: "Vektör"
    alt: "Parçalar sayılara nasıl dönüşür?"

  - id: serit-vektor
    tur: akis
    kademeli: false
    etkin: 2
    baslik: "Şeritte neredeyiz?"
    adimlar:
      - { ad: "Metin" }
      - { ad: "Token" }
      - { ad: "Vektör" }
      - { ad: "Dikkat" }
      - { ad: "Seçim" }
    not: |
      [35] "Model kelime bilmez, sayı bilir."

  - id: video-gomme
    tur: video
    baslik: "Token'dan vektöre"
    dosya: ../../animasyonlar/render/h02-m2.2-gomme.mp4
    kapak: ../../animasyonlar/render/h02-m2.2-gomme-kapak.png
    yer_tutucu: "M2.2 · BPE sözlüğünde her parçanın numarası → gömme tablosunda o numaralı satır (768 sayı) → vektör; tablo eğitimde rastgele başlar, düzeltilerek öğrenilir; sıra bilgisi eklenir (37 sn)"
    ipucu: "Token numarası, gömme tablosundaki satır numarasıdır; satırdaki sayılar eğitimde öğrenilir."

  - id: vektor
    tur: kavram
    baslik: "Token gömme (token embedding)"
    tanim: "Her token, sözlükteki numarasına karşılık gelen uzun bir sayı listesine çevrilir. Bu listeye vektör denir. Benzer anlamlı token'ların vektörleri birbirine yakındır."
    ornek: "“elma” → sözlükteki numarası → [0,12 · −0,83 · 0,44 · … ] (büyük modellerde birkaç bin sayı)"
    benzetme: "Harita koordinatı: Isparta ile Burdur birbirine yakın, Isparta ile Tokyo uzak. Vektör de anlam haritasında bir konum; yalnız iki değil, binlerce boyutlu."
    not: |
      [37] Bu sayılar elle yazılmaz; eğitim sırasında öğrenilir. "Model eğitmek" büyük ölçüde bu sayıları ayarlamak demektir.

  - id: video-yakinlik
    tur: video
    baslik: "Benzer kelimeler neden yakın?"
    dosya: ../../animasyonlar/render/h02-m2.6-yakinlik.mp4
    kapak: ../../animasyonlar/render/h02-m2.6-yakinlik-kapak.png
    yer_tutucu: "M2.6 · Aynı boşluğa uyan kelimeler benzer düzeltmeler alır; Türkçe GPT-2'nin gerçek gömme tablosunda şehirler, günler, renkler, meyveler kümelenir (38 sn)"
    ipucu: "Benzer cümlelerde geçen kelimeler, benzer vektörler kazanır."
    kaynak: "ytu-ce-cosmos/turkish-gpt2 gömme tablosu (wte), kosinüs benzerliği ve PCA, 09.10.2026"
    not: |
      [38] Harita ve komşu listeleri gerçek: ders sitesindeki modelin kendi tablosundan. Kimse "Isparta Burdur'a yakın" diye yazmadı; model metinlerden çıkardı. Hafta 8'deki anlamsal aramaya köprü.

  - id: konum
    tur: kavram
    baslik: "Sıra neden önemli?"
    tanim: "Dikkat mekanizması kelimelerin sırasını kendiliğinden bilmez. Bu yüzden her token'a “kaçıncı sıradayım” bilgisi eklenir. Buna konum kodlaması denir."
    ornek: "“Ali Ayşe'yi aradı” ile “Ayşe Ali'yi aradı”: aynı kelimeler, farklı anlam."
    benzetme: "Sinema bileti: Aynı salon, aynı film; koltuk numarası nerede oturduğunuzu söyler."
    not: |
      [40] Günümüz modellerinin çoğu RoPE (Su vd., 2021) yöntemini kullanır; adını anmak yeterli, ayrıntı yok.

  - id: iki-gomme
    tur: iki-kolon
    baslik: "İki farklı “gömme”: bu hafta ve Hafta 8"
    sol:
      baslik: "Token gömme (bu hafta)"
      maddeler:
        - "Modelin içinde, her token için"
        - "Amaç: cevabı üretmek"
        - "Siz görmezsiniz; model kullanır"
        - "Her modelin kendine özgü"
    sag:
      baslik: "Arama gömmesi (Hafta 8)"
      maddeler:
        - "Ayrı bir modelle, bütün bir cümle ya da paragraf için"
        - "Amaç: benzer belgeyi bulmak"
        - "Siz hesaplar, veritabanında saklarsınız"
        - "RAG sistemlerinin temeli"
    not: |
      [42] README'deki kritik ayrım. İkisi de "vektör" ama amaçları farklı. Hafta 8'de bu slayta geri döneceğiz.

  - id: model-boyutu
    tur: sayilar
    baslik: "Model boyutu: parametre sayısı"
    ogeler:
      - { sayi: "2–4B", ad: "Küçük", aciklama: "Dizüstünde, hatta telefonda çalışır. Ör. Gemma 4 E2B, E4B." }
      - { sayi: "26–31B", ad: "Orta", aciklama: "Güçlü bir ekran kartı ister. Ör. Gemma 4 31B." }
      - { sayi: "1T+", ad: "Çok büyük", aciklama: "Veri merkezinde çalışır. Ör. Qwen 3.8 (2,4T)." }
    alt: "B = milyar, T = trilyon parametre. Parametre: eğitimde öğrenilen sayılar. Büyük model genelde daha yetenekli ama daha pahalı ve yavaş."
    kaynak: "Google, Gemma 4 duyurusu (Nisan 2026) · Alibaba Qwen 3.8 · Hafta 5: kendi bilgisayarınızda model"
    not: |
      [44] Kaba kural: 7B bir model 4 bit'e sıkıştırılınca yaklaşık 4–5 GB bellek ister. Hafta 5'te "bilgisayarım hangi modeli kaldırır?" sayfasıyla hesaplayacağız. Kapalı modellerin boyutu çoğu zaman açıklanmaz.

  # ───────────────────────── BÖLÜM 3 · DİKKAT (20 dk) ─────────────────────────

  - id: bolum-3
    tur: bolum
    bolum: "3 · Dikkat"
    no: "Bölüm 3"
    baslik: "Dikkat"
    alt: "Kelimeler birbirine nasıl bakar?"

  - id: serit-dikkat
    tur: akis
    kademeli: false
    etkin: 3
    baslik: "Şeritte neredeyiz?"
    adimlar:
      - { ad: "Metin" }
      - { ad: "Token" }
      - { ad: "Vektör" }
      - { ad: "Dikkat" }
      - { ad: "Seçim" }
    not: |
      [50] Geçen hafta "Transformer, tek cümlede" slaytında bunun adını koymuştuk.

  - id: video-dikkat
    tur: video
    baslik: "“o” kime bakıyor?"
    dosya: ../../animasyonlar/render/h02-m2.3-dikkat.mp4
    kapak: ../../animasyonlar/render/h02-m2.3-dikkat-kapak.png
    yer_tutucu: "M2.3 · “Ali kitabı Ayşe'ye verdi çünkü o…”: “o”dan diğer kelimelere dikkat yayları; kalınlık = ağırlık (60 sn)"
    ipucu: "Yayın kalınlığı, “o”nun o kelimeye ne kadar dikkat ettiğini gösterir."

  - id: dikkat
    tur: kavram
    baslik: "Dikkat (attention)"
    tanim: "Her token, cümledeki diğer token'lara bakar ve her biri için “benim için ne kadar önemli?” ağırlığını hesaplar. Sonra kendi vektörünü bu ağırlıklarla günceller."
    ornek: "“yüz”: “Yüz lira verdi” · “Yüzünü yıkadı” · “Denizde yüzdü”. Hangi anlam olduğunu çevresindeki kelimeler belirler."
    benzetme: "Kalabalık bir toplantıda herkes konuşur; siz sizi ilgilendiren birkaç kişiye kulak verirsiniz. Her token da diğerlerine farklı oranda kulak verir."
    kaynak: "Vaswani vd., “Attention Is All You Need” (2017)"
    not: |
