# HAFTA 3 — İstem yazma, OpenRouter API ve düzenli çıktı
# Durum: TASLAK (15.10.2026). Akış: YOL-HARITASI.md §5 "Hafta 3 planı" (12.10.2026 hoca kararları).
# Videolar M3.1–M3.4 ve sayfalar V3.1–V3.3 henüz yok: video slaytları yer tutucu, sayfa adresleri planlanan adresler.
# OpenRouter bilgileri 12.10.2026'da belgelerden doğrulandı; ders haftası yeniden kontrol edilir (konusma.yaml → _ders.hazirlik).
# Notlardaki [dk] işaretleri dersin başından itibaren yaklaşık zamanı gösterir.
# Lab görev metinleri ve 8 yorum, Colab not defteri (hafta-03/lab.ipynb) ile AYNI olmalıdır.

deste:
  ad: hafta-03
  hafta: 3
  katman: 0
  baslik: "Hafta 3 · İstem yazma, OpenRouter API ve düzenli çıktı"
  yazar: "Asım Sinan Yüksel"

slaytlar:

  # ───────────────────────── AÇILIŞ (10 dk) ─────────────────────────

  - id: kapak
    tur: kapak
    bolum: Açılış
    ust: "Hafta 3"
    baslik: "İstem yazma, OpenRouter API ve düzenli çıktı"
    alt: "Sohbetten koda, paragraftan JSON'a"
    yazar: "Asım Sinan Yüksel · Bahar 2027"
    not: |
      [0] Bilgisayarlar açık olsun. Lab Google Colab'da; Google hesabıyla giriş ve OpenRouter hesabı (geçen haftanın ödevi) gerekli.

  - id: gecen-hafta
    tur: ifade
    etiket: "Geçen haftadan"
    metin: "Çıkış kartlarında en çok işaretlenen adım"
    alt: "Metin → Token → Vektör → Dikkat → Seçim. İki dakikada birlikte netleştirelim."
    not: |
      [1] Kartlarda en sık işaretlenen şerit adımını 2 dakikada tekrar edin. Genellikle "Dikkat" çıkar. Ardından köprü: "Seçim adımındaki sıcaklığı AI Studio'da kaydırdık; bugün aynı ayarı koddan vereceğiz."

  - id: bugunun-sorusu
    tur: ifade
    etiket: "Bugünün sorusu"
    metin: "100 müşteri yorumunu modele puanlatacaksınız. Her seferinde yalnızca bir puan dönmesini nasıl garanti edersiniz?"
    alt: "Başka hiçbir şey: açıklama yok, “Elbette!” yok, üç paragraf yok."
    not: |
      [3] Cevap almayın; soruyu asılı bırakın. Ders bu soruyu adım adım çözecek: istem → örnekler → JSON şeması.

  - id: canli-deneme
    tur: ifade
    etiket: "Canlı deneme"
    metin: "“Bu yorumu 1 ile 5 arasında puanla: Telefon harika ama şarj aleti iki günde bozuldu.”"
    alt: "Sohbet uygulamasına yazıyoruz. Cevap kaç satır geldi? Bir programa bu cevabı nasıl okuturdunuz?"
    not: |
      [4] Projeksiyonda ChatGPT, Gemini ya da Claude'a aynen yazın. Cevap büyük olasılıkla birkaç paragraf, artı/eksi listesi ve "3/5 diyebilirim" gibi bir cümle olur. Sorun: Bir Python programı bu metinden puanı güvenle çekemez. Dersin sonunda aynı yorumdan {"duygu": "karışık", "puan": 3, ...} gibi tek bir JSON alacağız. Sohbet uygulaması açılmazsa yedek: hafta-03/demo.ipynb, H3·4 hücresi.

  - id: neredeyiz
    tur: video
    baslik: "Neredeyiz?"
    dosya: ../../animasyonlar/render/h01-m1.3k-dort-katman-kisa.mp4
    kapak: ../../animasyonlar/render/h01-m1.3k-dort-katman-kisa-kapak.png
    ipucu: "Hâlâ İstem katmanındayız; bu hafta istemi koddan gönderiyor ve cevabı biçime sokuyoruz."
    not: |
      [5] Kısa geçin. İstem katmanının son iki haftası: H3 temel iskelet ve API, H4 iyileştirme ve ilk güvenlik uyarısı.

  - id: hedefler
    tur: liste
    numarali: true
    baslik: "Bu hafta neler öğreneceğiz?"
    maddeler:
      - "System, user ve assistant rollerini ve API'nin hafızasız çalıştığını açıklamak"
      - "Zero-shot, few-shot ve adım adım düşünmeyi aynı görevde karşılaştırmak"
      - "JSON şemasıyla çıktı istemek ve Python'da doğrulamak"
      - "Tek OpenRouter anahtarıyla iki modeli çağırmak; token ve maliyeti okumak"
    not: |
      [6] Dört hedef, dört bölüm.

  - id: bugunun-plani
    tur: tablo
    baslik: "Bugünün planı"
    basliklar: ["Bölüm", "Süre", "Ne yapacağız?"]
    genislikler: [3.6, 1.4, 7.1]
    satirlar:
      - ["1 · İstem ve roller", "25 dk", "İstemin altı parçası, ayırıcılar, mesajlar, API isteği"]
      - ["2 · Örnekle öğretmek", "15 dk", "Zero-shot, few-shot, adım adım düşünme"]
      - ["3 · Düzenli çıktı", "25 dk", "JSON şeması, kısıtlı çözümleme, Pydantic"]
      - ["4 · OpenRouter ve maliyet", "20 dk", "Limitler, fiyat, yedek model, önbellek, anahtar güvenliği"]
      - ["Mola + Lab", "70 dk", "Colab'da yorum puanlayıcı"]
      - ["Kapanış", "10 dk", "Sonuçlar, özet, ödev"]
    not: |
      [7] Lab'ın tamamı Colab'da; kimsenin bilgisayarına Python kurmasına gerek yok.

  # ───────────────────────── BÖLÜM 1 · İSTEM ANATOMİSİ, MESAJLAR VE ROLLER (25 dk) ─────────────────────────

  - id: bolum-1
    tur: bolum
    bolum: "1 · İstem ve roller"
    no: "Bölüm 1"
    baslik: "İstem, mesajlar ve roller"
    alt: "İyi bir istem hangi parçalardan oluşur ve modele nasıl gider?"

  - id: istem-parcalari
    tur: tablo
    baslik: "İstemin altı parçası"
    basliklar: ["Parça", "Yorum puanlayıcıda", "Nereye?"]
    genislikler: [2.7, 7.3, 2.1]
    satirlar:
      - ["Rol", "Müşteri yorumlarını puanlayan bir analistsin.", "system"]
      - ["Görev", "Bu yorumun duygusunu ve 1–5 puanını belirle.", "user"]
      - ["Bağlam", "Yorumlar bir elektronik mağazasından; ironi sık görülür.", "system"]
      - ["Örnekler", "Puanlanmış 2–3 yorum (Bölüm 2)", "system"]
      - ["Çıktı biçimi", "JSON: duygu, puan, gerekce", "system"]
      - ["Kısıtlar ve üslup", "Gerekçe en fazla 15 kelime, Türkçe.", "system"]
    alt: "Bir kontrol listesi, sihirli formül değil. İstemin iyi olup olmadığını test söyler."
    kaynak: "OpenAI, Anthropic ve Google istem rehberlerinin ortak çekirdeği · Schulhoff vd., The Prompt Report (2024)"
    not: |
      [11] Büyük sağlayıcıların rehberleri farklı adlar kullanır ama aynı parçaları sayar: OpenAI "Identity, Instructions, Examples, Context"; Google "Persona, Task, Context, Format"; The Prompt Report (arXiv 2406.06608) "Directive, Examples, Output formatting, Style, Role, Additional information". Kısaltma ezberletmeyin (CO-STAR vb. yok). Kural: sabit olan sisteme, her istekte değişen kullanıcı mesajına. Her parça her istemde gerekmez; kısa bir soruda yalnızca Görev yeter.

  - id: istem-ayiricili
    tur: kod
    baslik: "Aynı istem, bölümleri ayrılmış"
    dil: "markdown"
    kod: |
      ── system ──
      # Rol
      Müşteri yorumlarını puanlayan bir analistsin.
      # Bağlam
      Yorumlar bir elektronik mağazasından; ironi sık.
      # Çıktı biçimi
      JSON: duygu, puan, gerekce
      # Kısıtlar ve üslup
      Gerekçe en fazla 15 kelime, Türkçe.
      ── user ──
      Bu yorumun duygusunu ve 1–5 puanını belirle.
      <yorum>
      Telefon harika ama şarj aleti iki günde bozuldu.
      </yorum>
    vurgu: [12, 14]
    aciklama:
      - "# başlıkları bölümleri ayırır: Markdown."
      - "<yorum> etiketi değişken girdiyi talimattan ayırır: XML."
      - "Sistem mesajı her istekte aynı; yalnızca kullanıcı mesajı değişir."
    not: |
      [14] Lab'daki prompts/v1.txt tam olarak bu düzende. Model Markdown'ı ya da XML'i bir program gibi ayrıştırmaz; ikisini de "burada bir bölüm başlıyor, burada bitiyor" işareti olarak okur. OpenAI'nin örnek geliştirici mesajı da Markdown başlıkları + XML etiketli içerik kullanır.

  - id: ayiricilar
    tur: iki-kolon
    baslik: "Ayırıcılar: Markdown mı, XML mi?"
    sol:
      baslik: "Markdown başlıkları"
      maddeler:
        - "# Rol, # Görev, listeler"
        - "İstemin bölümlerini ayırır"
        - "İnsan için de okunaklı; istem dosyasında düzen"
        - "Kısa, tek parçalı istemde gereksiz"
    sag:
      baslik: "XML etiketleri"
      maddeler:
        - "<yorum>…</yorum>, <ornek>, <belge>"
        - "İçeriğin nerede başlayıp bittiği kesin olmalıysa"
        - "Değişken girdiyi talimattan ayırmak için"
        - "Etiket adları serbest; tutarlı olsun yeter"
    kaynak: "OpenAI, Prompt engineering guide · Anthropic, Use XML tags (erişim 12.10.2026)"
    not: |
      [16] İkisi birlikte en yaygın düzen: bölümler Markdown başlığıyla, değişken içerik XML etiketiyle. Hafta 4'te ayrıntı: iç içe etiketler, öznitelikler (<belge kaynak="...">), uzun belgeyi başa koymak ve girdiyi ayırmanın ilk güvenlik adımı olması. Eski bir alışkanlık: cevabı <cevap> etiketine yazdırıp ayıklamak; bugün bunun yerine Bölüm 3'teki yapılandırılmış çıktıyı kullanacağız.

  - id: tek-metin
    tur: kod
    baslik: "Sohbet aslında tek bir metin"
    dil: "text"
    yazitipi: "Consolas"
    punto: 14
    kod: |
      <bos><|turn>system
      # Rol
      Müşteri yorumlarını puanlayan bir analistsin.
      # Bağlam
      Yorumlar bir elektronik mağazasından; ironi sık.
      # Çıktı biçimi
      JSON: duygu, puan, gerekce
      # Kısıtlar ve üslup
      Gerekçe en fazla 15 kelime, Türkçe.<turn|>
      <|turn>user
      Bu yorumun duygusunu ve 1–5 puanını belirle.
      <yorum>
      Telefon harika ama şarj aleti iki günde bozuldu.
      </yorum><turn|>
      <|turn>model
      <|channel>thought
      <channel|>
    vurgu: [15, 16, 17]
    aciklama:
      - "10. slayttaki iki mesaj, Gemma 4'e bu tek metin olarak gider."
      - "Model metni “model” satırından devam ettirir. Boş düşünce bloğu: düşünme kapalı."
      - "Her model ailesinin kendi işaretleri var; API çeviriyi sizin yerinize yapar."
    kaynak: "google/gemma-4-31b-it, chat_template.jinja (Hugging Face, erişim 16.10.2026)"
    not: |
      [18] Hafta 2'ye bağ: Model yalnızca "sıradaki token"ı tahmin eder. Roller ayrı bir kanal değil; şablondaki özel token'lar (<|turn>system … <turn|>). Assistant'ın şablondaki adı "model". Metin "<|turn>model" ile açık kalır: model buradan devam eder. Düşünme açıksa sistem turunun başına <|think|> eklenir ve boş düşünce bloğu konmaz; model önce düşüncesini yazar. Gemma'nın eski sürümlerinde (Gemma 3) ayrı bir system turu yoktu, sistem metni ilk kullanıcı mesajına eklenirdi. Sistem mesajı "üstün" bir emir değildir; yalnızca eğitimde ona daha çok uyması öğretilmiş bir bölümdür (Hafta 4'te istem enjeksiyonunda önemli olacak).

  - id: tek-metin-openai
    tur: kod
    baslik: "Aynı istek OpenAI'nin biçiminde"
    dil: "text"
    yazitipi: "Consolas"
    punto: 12
    kod: |
      <|start|>system<|message|>You are ChatGPT, … OpenAI.
      Knowledge cutoff: 2024-06
      Current date: 2026-10-16
      Reasoning: low
      # Valid channels: analysis, commentary, final. …<|end|>
      <|start|>developer<|message|># Instructions
      # Rol
      Müşteri yorumlarını puanlayan bir analistsin.
      # Bağlam
      Yorumlar bir elektronik mağazasından; ironi sık.
      # Çıktı biçimi
      JSON: duygu, puan, gerekce
      # Kısıtlar ve üslup
      Gerekçe en fazla 15 kelime, Türkçe.<|end|>
      <|start|>user<|message|>Bu yorumun duygusunu ve 1–5 puanını belirle.
      <yorum>
      Telefon harika ama şarj aleti iki günde bozuldu.
      </yorum><|end|>
      <|start|>assistant
    vurgu: [1, 6]
    aciklama:
      - "Sizin system mesajınız burada developer rolüne geçer."
      - "system turunu OpenAI doldurur: kimlik, tarih, düşünme düzeyi."
      - "İçerik Gemma'dakiyle aynı; yalnızca işaretler farklı."
    kaynak: "OpenAI gpt-oss chat_template.jinja ve harmony biçimi (16.10.2026) · “…” kısaltma"
    not: |
      [19] Kaynak: OpenAI'nin açık ağırlıklı gpt-oss modelleri (openai/gpt-oss-120b, Hugging Face) ve “harmony” biçimi belgesi. 10. slayttaki iki mesaj şablondan geçirildi; developer ve user kısımları birebir, OpenAI'nin eklediği system başlığı kısaltıldı (tam hâli: “You are ChatGPT, a large language model trained by OpenAI.” ve “Channel must be included for every message.”). Gerçekte <|end|> ile <|start|> arasında satır başı yok. OpenAI'ye göre bu biçim kendi Responses API'sini taklit eder; ama GPT-5 gibi kapalı modellerin tam iç biçimi yayımlanmıyor, bu yüzden “OpenAI'nin açık modellerinde” deyin. Asıl ders: Aynı “system” kelimesi iki şablonda farklı yerlere gider. Gemma'da kendi turunu alır; gpt-oss'ta developer olur, system ise sağlayıcının kimlik ve ayar bölümüdür. Bu, sonraki slayttaki “developer” notunun da açıklaması. Model “assistant” satırından devam eder; önce analysis kanalında düşünür, cevabı final kanalına yazar.

  - id: roller
    tur: tablo
    baslik: "Üç rol"
    basliklar: ["Rol", "Kim yazar?", "Ne için?"]
    genislikler: [2.4, 3.2, 6.5]
    satirlar:
      - ["system", "Geliştirici (siz)", "Rol, bağlam, biçim ve kurallar; her istekte aynı"]
      - ["user", "Kullanıcı ya da programınız", "Görev ve girdi; her istekte değişir"]
      - ["assistant", "Model", "Önceki cevaplar; geçmişi geri gönderirken siz de eklersiniz"]
    alt: "OpenAI'nin yeni API'lerinde system yerine “developer” adı da geçer; görevi aynı."
    not: |
      [20] Assistant mesajını sizin yazabilmeniz önemli: few-shot örneklerini user/assistant çiftleri olarak da verebilirsiniz (Bölüm 2). Sohbet uygulamalarındaki "Custom instructions" ya da "Gem talimatları" aslında bir sistem mesajıdır.

  - id: video-yolculuk
    tur: video
    baslik: "Bir API isteğinin yolculuğu"
    dosya: ../../animasyonlar/render/h03-m3.1-yolculuk.mp4
    kapak: ../../animasyonlar/render/h03-m3.1-yolculuk-kapak.png
    yer_tutucu: "M3.1 · Python kodu → OpenRouter → sağlayıcı seçimi → model → cevap token token geri akar; ikinci turda tüm geçmiş yeniden gönderilir ve girdi token'ı büyür (45 sn)"
    ipucu: "Model hiçbir şey hatırlamaz: her istekte geçmişin tamamı yeniden gider."
    not: |
      [21] Videodan sonra sorun: "İkinci turda girdi token'ı neden büyüdü?"

  - id: hafizasiz
    tur: kavram
    baslik: "API hafızasızdır (stateless)"
    tanim: "Model önceki istekleri hatırlamaz. Sohbetin devam ettiğini sanmasının tek nedeni, her istekte geçmişin tamamını sizin yeniden göndermeniz."
    ornek: "3. turda gönderilen: system + user₁ + assistant₁ + user₂ + assistant₂ + user₃"
    benzetme: "Her sabah hafızası silinen bir asistan: Ona her gün dünkü yazışmaların tamamını yeniden okutursunuz."
    not: |
      [23] Sohbet uygulamaları bunu sizin yerinize yapar; API'de iş sizde. Sonuç: uzun sohbet her turda daha pahalı ve bağlam penceresi (Hafta 2) dolar. Hafta 6'da geçmişi kırpma ve özetleme. Canlı: hafta-03/demo.ipynb, H3·16–17 bölümü (geçmişsiz soruda model adı bilemez; girdi token'ı büyür).

  - id: hafizasiz-tablo
    tur: tablo
    baslik: "Her turda girdi büyür"
    basliklar: ["Tur", "Gönderilen mesajlar", "Girdi token (örnek)"]
    genislikler: [1.6, 7.0, 3.5]
    satirlar:
      - ["1", "system + user₁", "≈ 150"]
      - ["2", "system + user₁ + assistant₁ + user₂", "≈ 330"]
      - ["3", "… + assistant₂ + user₃", "≈ 520"]
      - ["10", "… tüm geçmiş", "≈ 2.000"]
    alt: "Toplu işte (100 yorum) her yorumu ayrı ve geçmişsiz bir istek olarak gönderin: hem ucuz hem bağımsız."
    not: |
      [24] Sayılar örnek; mesaj uzunluğuna göre değişir. Lab'da her yorum ayrı istek: system + user, geçmiş yok. Bir yorumun puanı ötekini etkilemez.

  - id: istek-kodu
    tur: kod
    baslik: "Python'dan ilk istek"
    dil: "python"
    kod: |
      from openai import OpenAI
      from google.colab import userdata

      client = OpenAI(
          base_url="https://openrouter.ai/api/v1",
          api_key=userdata.get("OPENROUTER_API_KEY"))

      cevap = client.chat.completions.create(
          model="recursive/flint-v1.0:free",
          messages=[
              {"role": "system", "content": sistem},
              {"role": "user", "content": kullanici}],
          temperature=0, max_tokens=200)
      print(cevap.choices[0].message.content)
    vurgu: [5, 9, 13]
    aciklama:
      - "OpenAI kütüphanesi, adres OpenRouter: aynı kod yüzlerce modelle çalışır."
      - "Anahtar kodda yazmaz; Colab Secrets'tan okunur."
      - "Model adı tek satır; değiştirmek modeli değiştirir."
      - "Sıcaklık ve en fazla token: Hafta 2'deki ayarlar artık kodda."
    kaynak: "OpenRouter, Quickstart (erişim 12.10.2026)"
    not: |
      [26] Lab'ın ilk hücresi bu. sistem ve kullanici değişkenleri prompts/v1.txt'den ve yorum listesinden gelir. max_tokens cevabı keser; kesilirse finish_reason "length" olur. Lab'da max_tokens 2000: iki model de düşünebilen (reasoning) model ve düşünme token'ları da bu sınıra dahil; düşük tutulsa cevap boş kalabilir. Canlı: hafta-03/demo.ipynb, H3·18–19 bölümü.

  - id: cevap-anatomisi
    tur: kod
    baslik: "Cevabın anatomisi"
    dil: "json"
    kod: |
      {
        "id": "gen-...",
        "model": "recursive/flint-v1.0:free",
        "choices": [{
          "message": {
            "role": "assistant",
            "content": "Karışık. Puan: 3. Ürün iyi..."},
          "finish_reason": "stop"}],
        "usage": {
          "prompt_tokens": 142,
          "completion_tokens": 31,
          "total_tokens": 173}
      }
    vurgu: [7, 10, 11]
    aciklama:
      - "content: modelin metni; hâlâ serbest metin."
      - "finish_reason: stop = kendisi bitirdi, length = sınıra takıldı."
      - "usage: girdi ve çıktı token'ı; ücret bunlardan hesaplanır."
    not: |
      [28] Değerler örnek. content'in hâlâ serbest metin olduğuna dikkat çekin: "Karışık. Puan: 3." Bunu ayıklamak kırılgan; Bölüm 3'ün konusu. usage'ı lab'da her istekte toplayacağız. Gerçek değerler: hafta-03/demo.ipynb, H3·18–19 bölümünün ikinci hücresi.

  - id: atolye
    tur: interaktif
    baslik: "Dene: İstem Atölyesi"
    url: "https://istem-muhendisligi-dersi.vercel.app/h03/atolye"
    kisa_url: "istem-muhendisligi-dersi.vercel.app/h03/atolye"
    adimlar:
      - "Altı parçayı tek tek açıp kapatın: messages JSON'u nasıl değişiyor?"
      - "Biçim düğmesi: Düz, Markdown, XML. Token sayısı ne kadar değişti?"
      - "“Asistan cevabı ekle” ile ikinci turu kurun: girdi token'ı kaç oldu?"
    sure: "6 dakika"
    kaynak: "Ders sitesi · model çağırmaz, anahtar istemez"
    not: |
      [30] Bilgisayarlardan açtırın. Beklenen: Markdown ve XML birkaç düzine token ekler; ikinci tur girdiyi iki katın üstüne çıkarır. Sayfanın verdiği Python kodu lab'daki koda çok benzer.

  - id: kontrol-roller
    tur: kontrol
    cevap_slayti: true
    soru: "Bir sohbet botu, kullanıcının üç mesaj önce söylediği adı hatırlıyor. Bu nasıl oluyor?"
    secenekler:
      - "Model her kullanıcı için ayrı bir hafıza tutar"
      - "Geliştirici geçmiş mesajları her istekte yeniden gönderir"
      - "Sistem mesajı modelin içine kalıcı olarak yazılır"
      - "Sıcaklık 0 olduğu için"
    dogru: 1
