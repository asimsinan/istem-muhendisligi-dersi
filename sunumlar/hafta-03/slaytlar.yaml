          model=MODEL, messages=mesajlar, temperature=0,
          response_format={
              "type": "json_schema",
              "json_schema": {"name": "puanlama",
                              "strict": True,
                              "schema": sema}},
          extra_body={"provider":
                      {"require_parameters": True}})

      metin = cevap.choices[0].message.content
      p = Puanlama.model_validate_json(metin)
      print(p.duygu, p.puan)
